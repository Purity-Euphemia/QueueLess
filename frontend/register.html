<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueLess — Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Queue<span>Less</span></a>
        <div class="navbar-links">
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Sign Up</a>
        </div>
    </nav>

    <main class="container">
        <section class="auth-card">
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join QueueLess and skip the line</p>

            <form id="register-form">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    placeholder="Your full name" 
                    required
                >

                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="your@email.com" 
                    required
                >

                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Create a strong password" 
                    required
                >

                <label for="confirm-password">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    placeholder="Confirm your password" 
                    required
                >

                <div class="auth-actions">
                    <button type="submit" class="btn-primary" id="register-btn">
                        Create Account
                    </button>
                </div>
            </form>

            <p id="error-message" class="error-message hidden"></p>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        QueueLess — Skip the Line
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script src="auth.js"></script>
    <script src="register.js"></script>

</body>

</html>
