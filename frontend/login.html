<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueLess — Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>Q</text></svg>">
</head>
<body class="light-theme split-body">

    <div class="login-split">
        
        <!-- Left Side: Form -->
        <div class="login-left">
            <div class="login-header">
                <a href="index.html" class="login-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="17" cy="17" r="2" fill="#009688" stroke="none"></circle>
                    </svg>
                    QueueLess
                </a>
                <div class="signup-link">
                    Don't have an account? <a href="get-started.html">Sign up</a>
                </div>
            </div>

            <div class="login-content">
                <h1>Welcome back 👋</h1>
                <p class="subtitle">Log in to continue to your account.</p>

                <form id="login-form">
                    <div class="input-group icon-input">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <div class="input-stack">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="Enter your email address" required>
                        </div>
                    </div>

                    <div class="input-group icon-input">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <div class="input-stack">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Enter your password" required>
                        </div>
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>

                    <div class="form-actions">
                        <label class="checkbox-container">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Remember me
                        </label>
                        <a href="reset-password.html" class="forgot-pwd">Forgot Password?</a>
                    </div>

                    <p id="error-message" class="error-message hidden"></p>

                    <button type="submit" class="btn-teal btn-block" id="login-btn">
                        Log In
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>

                    <div class="divider">
                        <span>or continue with</span>
                    </div>

                    <button type="button" class="btn-sso">
                        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Continue with Google
                    </button>

                    <button type="button" class="btn-sso">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.68-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 13.25 3.51 5.96 9.05 5.68c1.54.08 2.78.85 3.51.85.73 0 2.12-.91 3.86-.77 1.5.06 2.8.59 3.65 1.7-3.1 1.77-2.58 5.76.4 6.88-1.03 2.8-2.63 4.97-3.42 5.94zm-5.1-15.6c-.15-2.48 2.1-4.68 4.29-4.68 1.48 0 2.5 1.25 2.65 2.76.15 2.48-2.1 4.68-4.29 4.68-1.48 0-2.5-1.25-2.65-2.76z"/></svg>
                        Continue with Apple
                    </button>
                </form>
            </div>

            <div class="login-privacy">
                <div class="shield-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
                </div>
                <p>Your privacy is important to us.<br>We'll never share your information.</p>
            </div>
        </div>

        <!-- Right Side: Graphic -->
        <div class="login-right">
            <!-- Background handled in CSS -->
        </div>

    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
