<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueLess — Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Queue<span>Less</span></a>
        <div class="navbar-links">
            <a href="login.html">Login</a>
            <a href="register.html">Sign Up</a>
        </div>
    </nav>

    <main class="container">
        <section class="auth-card">
            <h1>Reset Password</h1>
            <p class="auth-subtitle">Recover access to your QueueLess account</p>

            <!-- Step 1: Request Reset Token -->
            <div id="step-request-container">
                <form id="request-reset-form">
                    <label for="request-email">Account Email</label>
                    <input 
                        type="email" 
                        id="request-email" 
                        placeholder="your@email.com" 
                        required
                    >

                    <button type="submit" class="btn-primary" id="request-btn">
                        Get Reset Token
                    </button>
                </form>
            </div>

            <!-- Step 2: Confirm Reset Password -->
            <div id="step-confirm-container" class="hidden">
                <form id="confirm-reset-form">
                    <label for="reset-token">Reset Token</label>
                    <input 
                        type="text" 
                        id="reset-token" 
                        placeholder="Paste reset token here" 
                        required
                    >

                    <label for="new-password">New Password</label>
                    <input 
                        type="password" 
                        id="new-password" 
                        placeholder="Enter new password" 
                        required
                    >

                    <label for="confirm-new-password">Confirm New Password</label>
                    <input 
                        type="password" 
                        id="confirm-new-password" 
                        placeholder="Confirm new password" 
                        required
                    >

                    <button type="submit" class="btn-primary" id="confirm-btn">
                        Update Password
                    </button>
                </form>
            </div>

            <p id="error-message" class="error-message hidden"></p>

            <div class="auth-footer">
                <p>Remembered your password? <a href="login.html">Sign in here</a></p>
                <p id="toggle-step-link" style="margin-top: 0.5rem;">
                    <a href="#" id="switch-step-btn">Already have a token? Set new password</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        QueueLess — Skip the Line
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <script src="auth.js"></script>
    <script src="reset-password.js"></script>

</body>

</html>
