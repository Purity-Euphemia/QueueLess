<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueLess — Skip the Line</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Queue<span>Less</span></a>
        <div class="navbar-links">
            <a href="index.html" class="active">Join Queue</a>
            <a href="admin.html">Admin Panel</a>
        </div>
    </nav>

    <main class="container">

        <!-- Hero -->
        <section class="hero">
            <div class="hero-badge">
                <span class="dot"></span>
                Digital Queue System
            </div>
            <h1>
                Stop waiting.<br>
                Start <span class="highlight">living</span>.
            </h1>
            <p class="description">
                Join a queue online and track your position
                from your phone. No more standing in lines.
            </p>
        </section>

        <!-- Join Queue Form -->
        <section class="card">
            <h2>Join a Queue</h2>

            <form id="join-form">
                <label for="name">Your name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="e.g. Amara Okafor"
                    required
                >

                <label for="queue">Select a queue</label>
                <select id="queue" required>
                    <option value="">Loading queues...</option>
                </select>

                <button type="submit" class="btn-primary" id="join-button">
                    Join Queue
                </button>
            </form>
        </section>

        <!-- Result Section -->
        <section id="result" class="result hidden">
            <h2>You're in the queue!</h2>
            <p id="welcome-message" class="subtitle"></p>

            <div class="queue-information">
                <div class="information-box">
                    <span class="label">Your Position</span>
                    <span id="position" class="number">0</span>
                    <p>in line</p>
                </div>

                <div class="information-box">
                    <span class="label">People Ahead</span>
                    <span id="people-ahead" class="number">0</span>
                    <p>waiting</p>
                </div>
            </div>
        </section>

        <!-- Error Message -->
        <p id="error-message" class="error-message hidden"></p>

    </main>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Footer -->
    <footer class="footer">
        QueueLess — Built for hackathon demo
    </footer>

    <script src="app.js"></script>

</body>

</html>
